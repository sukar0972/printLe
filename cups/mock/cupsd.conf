LogLevel info
AccessLogFormat
MaxLogSize 0
Listen 0.0.0.0:631
ServerAlias cups
Browsing Off
WebInterface Yes
DefaultAuthType Basic
ErrorPolicy retry-job

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

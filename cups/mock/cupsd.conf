LogLevel info
MaxLogSize 0
Listen 0.0.0.0:631
ServerAlias cups
Browsing Off
WebInterface Yes
DefaultAuthType Basic
ErrorPolicy retry-job

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

# CUPS is reachable only on printLe's internal Compose network. Authentication
# and authorization happen at the Spring API and token-protected print node, so
# allow that worker to submit and manage jobs even when CUPS normalizes the
# remote requesting user to "unknown".
<Policy default>
  <Limit All>
    Order allow,deny
    Allow all
  </Limit>
</Policy>

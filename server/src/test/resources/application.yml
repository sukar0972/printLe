spring:
  flyway.enabled: true
  jpa.open-in-view: false
  jpa.hibernate.ddl-auto: validate
printle:
  storage-path: ${java.io.tmpdir}/printle-tests
  bootstrap-admin-email: admin@test.local
  bootstrap-admin-password: test-password-123
  default-monthly-page-quota: 100
  quota-timezone: UTC
  held-job-ttl: 24h
  completed-job-retention: 720h
  failed-job-retention: 168h
  cleanup-interval-ms: 3600000

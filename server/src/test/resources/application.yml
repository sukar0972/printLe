spring:
  datasource:
    url: jdbc:h2:mem:printle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway.enabled: false
  jpa.open-in-view: false
  jpa.hibernate.ddl-auto: create-drop
printle:
  storage-path: ${java.io.tmpdir}/printle-tests
  bootstrap-admin-email: admin@test.local
  bootstrap-admin-password: test-password-123
  default-monthly-page-quota: 100
  print-node-url: http://print-node.test
  default-cups-queue: mock-success
  quota-timezone: UTC
  held-job-ttl: 24h
  completed-job-retention: 720h
  failed-job-retention: 168h
  cleanup-interval-ms: 3600000
  print-node-token: test-token
